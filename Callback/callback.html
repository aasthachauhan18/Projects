<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise with Category Filter</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-4">

    <div class="mb-3">
      <select name="product" id="product" class="form-select w-auto">
        <option value="null">Select Category</option>
        <option value="men's clothing">Men's Clothing</option>
        <option value="jewelery">Jewellery</option>
        <option value="electronics">Electronics</option>
        <option value="women's clothing">Women's Clothing</option>
      </select>
    </div>

    <div id="box" class="d-flex flex-wrap gap-3"></div>

    <script>
      const box = document.getElementById("box");
      const productSelect = document.getElementById("product");
      let allProducts = [];

      // Fetch all products initially (but don’t display)
      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((data) => {
          allProducts = data;
          console.log("Products loaded");
        })
        .catch((err) => console.log("Error:", err));

      // Display products dynamically
      function displayProducts(products) {
        box.innerHTML = ""; // clear previous
        if (products.length === 0) {
          box.innerHTML = `<p>No products found for this category.</p>`;
          return;
        }

        products.forEach((product) => {
          box.innerHTML += `
            <div class="card" style="width: 18rem;">
              <img src="${product.image}" class="card-img-top" alt="Product image">
              <div class="card-body">
                <h5 class="card-title">${product.title}</h5>
                <p class="card-text">$${product.price}</p>
                <a href="#" class="btn btn-primary">View</a>
              </div>
            </div>`;
        });
      }

      // Handle category change
      productSelect.addEventListener("change", () => {
        const category = productSelect.value;

        if (category === "null") {
          box.innerHTML = ""; // hide all when nothing selected
        } else {
          const filtered = allProducts.filter(
            (p) => p.category === category
          );
          displayProducts(filtered);
        }
      });
    </script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
